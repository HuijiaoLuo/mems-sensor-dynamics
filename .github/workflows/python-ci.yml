name: Conda Python physics CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: mems-sensor-simulink
          environment-file: environment.yml
          auto-activate: true
          channel-priority: strict

      - name: Run physics and numerical tests
        run: python -m pytest tests/python -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: test-results.xml
